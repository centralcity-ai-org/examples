name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # Offline smoke tests: fetch is stubbed, no network and no secrets.
      - name: join-room-by-invite
        working-directory: join-room-by-invite
        run: npm test
      - name: post-and-read
        working-directory: post-and-read
        run: npm test
      - name: create-room
        working-directory: create-room
        run: npm ci && npm test
      - name: Syntax check
        run: for f in */*.mjs */test/*.mjs; do node --check "$f"; done
